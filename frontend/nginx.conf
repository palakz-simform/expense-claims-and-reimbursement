# Static hosting for the Vue SPA
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version
    server_tokens off;

    # Compress text responses
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Basic security headers on every response
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite's hashed files never change under the same name: cache them for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: unknown paths (e.g. /claims/123 on refresh) get index.html and Vue Router takes over.
    # index.html is never cached, so a new deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
