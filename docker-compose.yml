# Local stack: the API and the web app. The database is Neon (hosted), so there is no database container.
services:
  backend:
    # Build the image from backend/Dockerfile
    build: ./backend
    image: expense-claims-api
    # Settings and secrets come from backend/.env at run time (never baked into the image)
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      # Fixed inside the container; the host side of `ports` is what you change
      PORT: "4000"
      # Production mode only accepts listed browser origins: allow the frontend container below.
      # Overrides any CORS_ORIGIN in backend/.env for this local stack only.
      CORS_ORIGIN: "http://localhost:${WEB_PORT:-8080}"
    # host:container. The host port defaults to 4000; override it when 4000 is taken,
    # e.g. `API_PORT=4001 docker compose up`
    ports:
      - "${API_PORT:-4000}:4000"
    # Restart after a crash or a reboot, but not after `docker compose stop`
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # The URL the BROWSER uses to reach the API (baked in at build time, so a change needs a rebuild).
        # Keep it in step with API_PORT, e.g. `API_PORT=4001 VITE_API_URL=http://localhost:4001 docker compose up --build`
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4000}"
    image: expense-claims-web
    # nginx inside listens on 8080 (non-root); override the host side with WEB_PORT
    ports:
      - "${WEB_PORT:-8080}:8080"
    # Start after the API; the browser, not this container, makes the API calls
    depends_on:
      - backend
    restart: unless-stopped
